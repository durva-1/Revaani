<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReVaani - Gujarati AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #ececec;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            background: #0f0f0f;
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #2a2a2a;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 2px;
            background: linear-gradient(135deg, #fff 0%, #ccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 12px;
            color: #888;
            letter-spacing: 0.5px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #666;
        }

        .empty-state h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ccc;
        }

        .empty-state p {
            font-size: 14px;
            color: #666;
        }

        .message {
            display: flex;
            margin-bottom: 4px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 65%;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 15px;
        }

        .user .message-content {
            background: #1a73e8;
            color: white;
        }

        .assistant .message-content {
            background: #2a2a2a;
            color: #ececec;
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #2a2a2a;
            background: #0a0a0a;
            display: flex;
            gap: 8px;
        }

        .input-controls {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .message-input {
            flex: 1;
            padding: 11px 14px;
            background: #2a2a2a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #ececec;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .message-input:focus {
            border-color: #1a73e8;
        }

        .message-input::placeholder {
            color: #666;
        }

        .message-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn {
            padding: 11px 20px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn:hover:not(:disabled) {
            background: #1765d0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.voice {
            background: #ea4335;
            padding: 11px 16px;
        }

        .btn.voice:hover:not(:disabled) {
            background: #d33425;
        }

        .btn.voice.recording {
            background: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .typing {
            color: #999;
            font-style: italic;
        }

        .status {
            font-size: 12px;
            color: #888;
            padding: 0 14px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo">🎤</div>
                <div>
                    <h1>ReVaani</h1>
                    <p>Gujarati AI Assistant</p>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <h2>Start a conversation</h2>
                <p>Type or speak in Gujarati</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-controls">
                <input 
                    type="text" 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Message ReVaani..."
                    onkeypress="handleKeyPress(event)"
                >
                <button class="btn voice" id="voiceBtn" onclick="toggleVoiceRecording()">
                    🎙️ Record
                </button>
            </div>
            <button class="btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let messages = [];
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        const userId = 'user-' + Math.random().toString(36).substr(2, 9);
        const conversationId = 'conv-' + Date.now();

        // Initialize
        async function init() {
            console.log('ReVaani initialized');
        }

        // Add message to UI
        function addMessage(role, text) {
            const container = document.getElementById('chatContainer');
            
            // Remove empty state if first message
            if (messages.length === 0) {
                container.innerHTML = '';
            }

            messages.push({ role, text });

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Escape HTML to prevent injection
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Send text message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) return;

            addMessage('user', text);
            input.value = '';

            document.getElementById('sendBtn').disabled = true;
            addMessage('assistant', 'Thinking...');

            try {
                const response = await fetch(`${API_BASE}/chat/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        conversation_id: conversationId,
                        text: text,
                        language: 'gu'
                    })
                });

                if (!response.ok) throw new Error('API error');
                const data = await response.json();

                // Remove "Thinking..." message
                const container = document.getElementById('chatContainer');
                container.removeChild(container.lastChild);

                addMessage('assistant', data.ai_response);
            } catch (error) {
                console.error('Error:', error);
                const container = document.getElementById('chatContainer');
                container.removeChild(container.lastChild);
                addMessage('assistant', 'Connection error. Please try again.');
            } finally {
                document.getElementById('sendBtn').disabled = false;
            }
        }

        // Voice recording
        async function toggleVoiceRecording() {
            const voiceBtn = document.getElementById('voiceBtn');

            if (!isRecording) {
                // Start recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = processAudio;

                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording');
                    voiceBtn.textContent = '🎙️ Stop';
                } catch (error) {
                    alert('Microphone access denied');
                }
            } else {
                // Stop recording
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎙️ Record';
            }
        }

        // Process recorded audio
        async function processAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            console.log('Audio recorded:', audioBlob.size, 'bytes');

            // For now, just show a placeholder message
            addMessage('user', '[Voice message sent]');
            addMessage('assistant', 'Voice input coming soon! Send text for now.');
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        init();
    </script>
</body>
</html>
