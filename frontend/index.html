<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReVaani</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", "Nirmala UI", "Noto Sans Gujarati", Arial, sans-serif;
    background: #ffffff;
    color: #202123;
}

#auth-screen {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    background: #f7f7f8;
}

.auth-box {
    background: #ffffff;
    width: 360px;
    padding: 32px;
    border-radius: 12px;
    border: 1px solid #e5e5e5;
}

.auth-box h1 {
    margin: 0;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #6b6c7b;
    margin: 4px 0 20px 0;
    font-size: 14px;
}

.auth-box input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.auth-box button {
    width: 100%;
    padding: 11px;
    background: #202123;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.register-only {
    display: none;
}

#auth-error {
    color: #d93025;
    font-size: 14px;
    min-height: 18px;
    margin: 10px 0 0 0;
    text-align: center;
}

.switch {
    text-align: center;
    font-size: 14px;
    margin: 12px 0 0 0;
}

.switch a {
    color: #202123;
    font-weight: bold;
    cursor: pointer;
}

#app-screen {
    display: none;
    height: 100vh;
}

.sidebar {
    width: 270px;
    background: #f7f7f8;
    border-right: 1px solid #e5e5e5;
    display: flex;
    flex-direction: column;
    padding: 12px;
}

.new-chat {
    padding: 10px;
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 12px;
}

#history-list {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.history-item:hover {
    background: #ececf1;
}

.history-item.active {
    background: #e3e3e8;
}

.history-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.delete-btn {
    border: none;
    background: none;
    color: #8e8ea0;
    font-size: 18px;
    cursor: pointer;
}

.delete-btn:hover {
    color: #d93025;
}

.empty-history {
    color: #8e8ea0;
    font-size: 14px;
    padding: 10px;
}

.sidebar-footer {
    border-top: 1px solid #e5e5e5;
    padding-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
}

.sidebar-footer button {
    padding: 6px 12px;
    border: 1px solid #d1d5db;
    background: #ffffff;
    border-radius: 6px;
    cursor: pointer;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

#chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
}

.message {
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 80%;
    line-height: 1.6;
    white-space: pre-wrap;
}

.message.user {
    background: #202123;
    color: #ffffff;
    margin-left: auto;
}

.message.assistant {
    background: #f1f1f4;
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 16px 24px 24px 24px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
}

.input-area input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
}

.input-area button {
    padding: 0 22px;
    background: #202123;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}
.input-area .mic-button {
    padding: 0 16px;
    background: #ffffff;
    color: #202123;
    border: 1px solid #d1d5db;
    font-size: 20px;
}

.input-area .mic-button.listening {
    background: #d93025;
    color: #ffffff;
    border-color: #d93025;
}
</style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h1>ReVaani</h1>
        <p class="subtitle">Gujarati AI voice assistant</p>

        <input id="full-name" class="register-only" placeholder="Full name">
        <input id="region" class="register-only" placeholder="Region (for example: Ahmedabad)">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password (minimum 6 characters)" onkeypress="handleAuthKey(event)">

        <button id="auth-button" onclick="submitAuth()">Login</button>
        <p id="auth-error"></p>
        <p class="switch">
            <span id="switch-text">New to ReVaani?</span>
            <a id="switch-link" onclick="toggleMode()">Create account</a>
        </p>
    </div>
</div>

<div id="app-screen">
    <div class="sidebar">
        <button class="new-chat" onclick="newChat()">+ New chat</button>
        <div id="history-list"></div>
        <div class="sidebar-footer">
            <span id="user-name"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="main">
        <div id="chat-box"></div>
        <div class="input-area">
           <input id="message-input" placeholder="ગુજરાતીમાં લખો..." onkeypress="handleKeyPress(event)">
<button id="mic-button" class="mic-button" onclick="toggleMic()" title="Speak in Gujarati">🎤</button>
<button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:8000";
let token = localStorage.getItem("token");
let conversationId = null;
let registerMode = false;

function showAuth() {
    document.getElementById("auth-screen").style.display = "flex";
    document.getElementById("app-screen").style.display = "none";
}

function showApp() {
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "flex";
    document.getElementById("user-name").textContent = localStorage.getItem("name");
    newChat();
}

function toggleMode() {
    registerMode = !registerMode;

    const extras = document.getElementsByClassName("register-only");
    for (let i = 0; i < extras.length; i++) {
        extras[i].style.display = registerMode ? "block" : "none";
    }

    document.getElementById("auth-button").textContent = registerMode ? "Create account" : "Login";
    document.getElementById("switch-text").textContent = registerMode ? "Already have an account?" : "New to ReVaani?";
    document.getElementById("switch-link").textContent = registerMode ? "Login" : "Create account";
    document.getElementById("auth-error").textContent = "";
}

function handleAuthKey(event) {
    if (event.key === "Enter") {
        submitAuth();
    }
}

async function submitAuth() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("auth-error");
    errorBox.textContent = "";

    let url = API + "/auth/login";
    let body = { email: email, password: password };

    if (registerMode) {
        url = API + "/auth/register";
        body.full_name = document.getElementById("full-name").value.trim();
        body.region = document.getElementById("region").value.trim();
    }

    try {
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        const data = await response.json();

        if (!response.ok) {
            if (typeof data.detail === "string") {
                errorBox.textContent = data.detail;
            } else {
                errorBox.textContent = "Please check your details and try again";
            }
            return;
        }

        token = data.token;
        localStorage.setItem("token", data.token);
        localStorage.setItem("name", data.full_name);
        document.getElementById("password").value = "";
        showApp();
    } catch (error) {
        errorBox.textContent = "Cannot reach the server. Is the backend running?";
    }
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("name");
    token = null;
    conversationId = null;
    showAuth();
}

async function apiFetch(path, options) {
    options = options || {};
    options.headers = options.headers || {};
    options.headers["Authorization"] = "Bearer " + token;

    if (options.body) {
        options.headers["Content-Type"] = "application/json";
    }

    const response = await fetch(API + path, options);

    if (response.status === 401) {
        logout();
        throw new Error("Session expired");
    }

    return response;
}

function addMessage(role, text) {
    const chatBox = document.getElementById("chat-box");
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

function newChat() {
    conversationId = null;
    document.getElementById("chat-box").innerHTML = "";
    addMessage("assistant", "નમસ્તે! હું ReVaani છું. હું તમારી કેવી રીતે મદદ કરી શકું?");
    loadHistory();
}

async function loadHistory() {
    const list = document.getElementById("history-list");
    list.innerHTML = "";

    try {
        const response = await apiFetch("/chat/conversations");
        const data = await response.json();

        if (data.conversations.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-history";
            empty.textContent = "No chats yet";
            list.appendChild(empty);
            return;
        }

        for (let i = 0; i < data.conversations.length; i++) {
            const c = data.conversations[i];

            const item = document.createElement("div");
            item.className = "history-item";
            if (c.conversation_id === conversationId) {
                item.classList.add("active");
            }

            const title = document.createElement("span");
            title.className = "history-title";
            title.textContent = c.title;
            title.onclick = function () {
                openConversation(c.conversation_id);
            };

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "×";
            deleteButton.onclick = function () {
                deleteConversation(c.conversation_id);
            };

            item.appendChild(title);
            item.appendChild(deleteButton);
            list.appendChild(item);
        }
    } catch (error) {
        console.log("Could not load history", error);
    }
}

async function openConversation(id) {
    try {
        const response = await apiFetch("/chat/conversations/" + id);
        const data = await response.json();

        conversationId = id;
        document.getElementById("chat-box").innerHTML = "";

        for (let i = 0; i < data.messages.length; i++) {
            addMessage("user", data.messages[i].message);
            addMessage("assistant", data.messages[i].ai_response);
        }

        loadHistory();
    } catch (error) {
        console.log("Could not open conversation", error);
    }
}

async function deleteConversation(id) {
    if (!confirm("Delete this chat?")) {
        return;
    }

    try {
        await apiFetch("/chat/conversations/" + id, { method: "DELETE" });

        if (id === conversationId) {
            newChat();
        } else {
            loadHistory();
        }
    } catch (error) {
        console.log("Could not delete conversation", error);
    }
}

function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

async function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();

    if (text === "") {
        return;
    }

    input.value = "";
    addMessage("user", text);
    const waiting = addMessage("assistant", "...");

    let body = { text: text, language: "gu" };
    if (conversationId !== null) {
        body.conversation_id = conversationId;
    }

    try {
        const response = await apiFetch("/chat/messages", {
            method: "POST",
            body: JSON.stringify(body)
        });
        const data = await response.json();

        if (!response.ok) {
            waiting.textContent = "Something went wrong. Please try again.";
            return;
        }

        waiting.textContent = data.ai_response;
        conversationId = data.conversation_id;
        loadHistory();
    } catch (error) {
        waiting.textContent = "Cannot reach the server.";
    }
}
let recognition = null;
let isListening = false;

function setupMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        document.getElementById("mic-button").style.display = "none";
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "gu-IN";
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onresult = function (event) {
        const spokenText = event.results[0][0].transcript;
        document.getElementById("message-input").value = spokenText;
    };

    recognition.onend = function () {
        isListening = false;
        document.getElementById("mic-button").classList.remove("listening");
    };

    recognition.onerror = function (event) {
        isListening = false;
        document.getElementById("mic-button").classList.remove("listening");
        if (event.error === "not-allowed") {
            alert("Please allow microphone access in your browser.");
        }
        console.log("Mic error:", event.error);
    };
}

function toggleMic() {
    if (isListening) {
        recognition.stop();
        return;
    }
    recognition.start();
    isListening = true;
    document.getElementById("mic-button").classList.add("listening");
}

setupMic();

if (token) {
    showApp();
} else {
    showAuth();
}
</script>

</body>
</html>
